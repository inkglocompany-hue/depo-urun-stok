<!doctype html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b718f"><title>NFC Depo Yönetimi | Nur Ajanda</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="intro" class="intro-screen" aria-label="NFC bağlantı ekranı">
  <div class="intro-content">
    <div class="nfc-intro-mark">
      <div class="nfc-chip">NFC</div>
      <i class="wave wave-1"></i><i class="wave wave-2"></i><i class="wave wave-3"></i>
    </div>
    <div class="intro-title">NFC ile bağlanılıyor</div>
    <div class="intro-subtitle">Depo ürün yönetimi hazırlanıyor</div>
    <img class="intro-logo" src="https://raw.githubusercontent.com/inkglocompany-hue/nurajanda-nfc/main/logo.png" alt="Nur Ajanda">
    <div class="intro-line"><span></span></div>
  </div>
</div>
<div id="app" class="app-shell intro-hidden">
<header class="topbar"><div><span class="eyebrow">NFC DEMO</span><h1>Depo Yönetimi</h1></div><button class="icon-btn" id="resetBtn">↻</button></header>
<main>
<section class="nfc-card"><div class="nfc-ring"><span>⌁</span></div><div><strong>NFC ile ürüne bağlanın</strong><p>Defter kapağındaki NFC etiketi okutulduğunda ilgili ürün ekranı açılabilir.</p></div></section>
<section id="dashboardView" class="view active"><div class="section-head"><div><span class="eyebrow">GENEL BAKIŞ</span><h2>Stok Durumu</h2></div><button class="primary" id="addProductBtn">+ Ürün</button></div>
<div class="stats"><div class="stat"><span>Ürün</span><b id="productCount">0</b></div><div class="stat"><span>Toplam Stok</span><b id="totalStock">0</b></div><div class="stat"><span>Az Stok</span><b id="lowStock">0</b></div></div>
<label class="search"><span>⌕</span><input id="searchInput" placeholder="Ürün, kod veya kategori ara"></label><div id="productList" class="product-list"></div></section>
<section id="productView" class="view"><button class="back" id="backBtn">← Stok listesine dön</button><div id="productDetail"></div></section>
<section id="historyView" class="view"><div class="section-head"><div><span class="eyebrow">HAREKETLER</span><h2>Stok Geçmişi</h2></div></div><div id="historyList" class="history-list"></div></section>
</main><nav class="bottom-nav"><button class="nav-btn active" data-view="dashboardView"><span>⌂</span>Stok</button><button class="nav-btn" data-view="historyView"><span>◷</span>Hareketler</button></nav></div>
<div id="modal" class="modal hidden"><div class="modal-box"><button class="close" id="closeModal">×</button><span class="eyebrow">YENİ ÜRÜN</span><h2>Ürün Ekle</h2><form id="productForm"><input name="name" required placeholder="Ürün adı"><input name="code" required placeholder="Ürün kodu (örn. NA-001)"><input name="category" placeholder="Kategori"><div class="two"><input name="stock" type="number" min="0" value="0" placeholder="Stok"><input name="minStock" type="number" min="0" value="10" placeholder="Minimum stok"></div><button class="primary wide">Ürünü Kaydet</button></form></div></div>
<script src="app.js"></script></body></html>
